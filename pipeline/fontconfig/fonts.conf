<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  LibreOffice headless 在本机通过 fontconfig 找字体，而 fontconfig 的默认
  `sans-serif:lang=zh` 会解析到 Verdana（没有中文字形），导致导出的 PDF 里
  中文整段空白。convert.py 调用 soffice 时会设置 FONTCONFIG_PATH 指向本目录。

  注意：设置 FONTCONFIG_PATH 会覆盖 fontconfig 的默认搜索路径，所以必须
  显式 include 系统配置，否则一个字体都找不到。
-->
<fontconfig>
  <include ignore_missing="yes">/opt/homebrew/etc/fonts/fonts.conf</include>
  <include ignore_missing="yes">/usr/local/etc/fonts/fonts.conf</include>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>

  <!-- 无衬线：中文兜底到苹方 -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>PingFang SC</string></edit>
  </match>

  <!-- 衬线：中文兜底到宋体 -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Songti SC</string></edit>
  </match>

  <!-- 任意字体族遇到中文字符时，追加苹方作为最后兜底 -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh</string></test>
    <edit name="family" mode="append" binding="weak"><string>PingFang SC</string></edit>
  </match>
</fontconfig>
